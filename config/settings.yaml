ingestion:
  hf_dataset_name: "McAuley-Lab/Amazon-Reviews-2023"
  hf_config_name: "raw_meta_Electronics"
  hf_split: "full"

  target_product_count: 5000
  log_every_n_examined: 10000
  min_review_count: 5

  output_path: "data/raw/products_sample.parquet"

  keep_fields:
    - "parent_asin"
    - "title"
    - "description"
    - "features"
    - "price"
    - "average_rating"
    - "rating_number"
    - "store"
    - "categories"
    - "main_category"

  audio_categories:
    - "Earbud Headphones"
    - "Over-Ear Headphones"
    - "On-Ear Headphones"
    - "Headphones & Earbuds"
    - "Headsets"
    - "Headsets & Microphones"
    - "Computer Headsets"
    - "Bluetooth Headsets"
    - "Car Headphones"

reviews:
  target_review_count: 75000
  max_records_to_examine: 12000000
  max_reviews_per_product: 100
  min_review_length: 15
  log_every_n_examined: 500000
  output_path: "data/raw/reviews_sample.parquet"
  min_word_count: 6
  output_path_clean: "data/processed/reviews_clean.parquet"

aggregates:
  output_path: "data/aggregates/product_aggregates.parquet"

search:
  bm25_index_path: "indexes/bm25_index.pkl"
  embedding_model: "all-MiniLM-L6-v2"
  embeddings_path: "indexes/product_embeddings.npy"
  faiss_index_path: "indexes/faiss_index.bin"
  embedding_ids_path: "indexes/embedding_ids.pkl"

backend:
  host: "0.0.0.0"
  port: 8000
  top_k_default: 10
  top_k_max: 20
